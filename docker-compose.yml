services:
  tensorboard:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile
    volumes:
      - .:/app
    ports:
      - "6006:6006"
    command: tensorboard --logdir /app/logs --host 0.0.0.0 --port 6006

  sim:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: python -m pytest

  recorder:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: python -m crashlearn_sim.legacy.record --steps 500 --num-cars 1 --out recordings/episode.npz

  replay:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: python -m crashlearn_sim.legacy.replay --npz recordings/episode.npz --no-display
