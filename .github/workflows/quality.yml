name: Quality

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -e ".[dev,legacy]"
      - name: Lint
        run: python -m ruff check src/crashlearn_sim tests
      - name: Formatting
        run: python -m ruff format --check src/crashlearn_sim tests
      - name: Regression tests
        run: python -m pytest
      - name: Build distribution
        run: python -m build --wheel
      - name: Install built wheel
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', glob.glob('dist/*.whl')[0]])"
      - name: Test installed package
        run: python -m pytest tests/test_architecture.py tests/test_competition.py
